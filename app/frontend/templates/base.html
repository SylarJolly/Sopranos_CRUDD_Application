<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sopranos{% endblock %} · The Sopranos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="The Sopranos">
    </a>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('characters') }}">Characters</a>
    </nav>
  </header>
  <main>
    {% if undo %}
      <form class="undo" method="post" action="{{ url_for('undo') }}">
        <span>{{ undo.label }}</span>
        <button class="btn sm" type="submit">Undo</button>
      </form>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
