{% extends "base.html" %}
{% block title %}{% if character.id %}Edit character{% else %}Add character{% endif %}{% endblock %}

{% block content %}
    <h1>{% if character.id %}Edit {{ character.name }}{% else %}Add a character{% endif %}</h1>
    {% if error %}
        <p class="errors">{{ error }}</p>
    {% endif %}
    <form class="card" method="post" enctype="multipart/form-data">
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ character.name or '' }}" required>

        <label for="actor">Actor</label>
        <input id="actor" name="actor" value="{{ character.actor or '' }}" required>

        <label for="role">Role</label>
        <input id="role" name="role" value="{{ character.role or '' }}" required>

        <label for="status">Status</label>
        <select id="status" name="status">
            {% for s in ["Alive", "Dead", "Comatose", "Imprisoned", "Unknown"] %}
                <option value="{{ s }}" {% if character.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>

        <label for="first_season">First season (1-6)</label>
        <input id="first_season" name="first_season" type="number" min="1" max="6"
               value="{{ character.first_season or '' }}" required>

        <label for="last_season">Last season (1-6)</label>
        <input id="last_season" name="last_season" type="number" min="1" max="6"
               value="{{ character.last_season or '' }}" required>
        <label for="photo">Photo (PNG, optional)</label>
        <input id="photo" name="photo" type="file" accept="image/png">
        <div class="actions" style="justify-content:flex-start;margin-top:20px">
            <button class="btn" type="submit">Save</button>
            <a class="btn ghost" href="{{ url_for('characters') }}">Cancel</a>
        </div>
    </form>
{% endblock %}
